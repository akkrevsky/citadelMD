server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  # Docker's embedded DNS: re-resolve upstream hostnames so restarts that
  # reassign container IPs never leave stale cached addresses behind.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /socket/ {
    set $yjs_upstream http://yjs-server:1235;
    proxy_pass $yjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 86400s;
  }

  location /mcp {
    set $mcp_upstream http://mcp-server:3100;
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Vite emits content-hashed asset filenames — cache them forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# AI agent (dsh) — local-only gate. dsh has no auth of its own, so the only
# way in is this vhost on 8082 with an auth_request against the backend.
# Not reachable remotely until the external nginx forwards 8082 (or a
# dedicated hostname is set up) — by design for now.
server {
  listen 8082;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Internal auth gate: 2xx from /api/auth/me => allowed, 401 => denied.
  location = /_dsh_auth {
    internal;
    set $auth_upstream http://backend:3000/api/auth/me;
    proxy_pass $auth_upstream;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    auth_request /_dsh_auth;
    set $dsh_upstream http://dsh:3080;
    proxy_pass $dsh_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The dsh SPA sits in an iframe on the 8081 origin while the agent lives
    # on 8082, so its Origin header never matches the Host dsh sees and its
    # anti-CSRF fence refuses every /api call. Drop the header here: dsh
    # treats an absent Origin as fine, the Host fence (DNS-rebinding) and
    # sec-fetch-site stay intact, and this vhost is already behind
    # auth_request — the real auth boundary.
    proxy_set_header Origin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
