worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 30M;

  # Docker's embedded DNS: re-resolve upstream hostnames so restarts that
  # reassign container IPs never leave stale cached addresses behind.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    # Phase 0: plain HTTP (no TLS yet). TLS added in Phase 6.

    location = /api/auth/login {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /mcp {
      set $mcp_upstream http://mcp-server:3100;
      proxy_pass $mcp_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location /socket {
      set $yjs_upstream http://yjs-server:1235;
      proxy_pass $yjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location / {
      set $web_upstream http://web:80;
      proxy_pass $web_upstream;
      proxy_set_header Host $host;
    }
  }
}
